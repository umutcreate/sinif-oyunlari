<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Turnuvası</title>
    <!-- Google Fonts: Eğlenceli ve okunaklı font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1 class="brand">🏆 İNGİLİZCE TURNUVASI</h1>
        <p>İngilizce öğren. Oyna. Geliş.</p>
    </header>

    <nav>
        <button id="gameNav" class="nav-button active" onclick="showPage('game')">🎮 Akıllı Tahta</button>
        <button id="teacherNav" class="nav-button" onclick="showPage('teacher')">👨‍🏫 Öğretmen Paneli</button>
    </nav>

    <main>
        <!-- OYUN (AKILLI TAHTA) BÖLÜMÜ -->
        <section id="game">
            <div id="gameSetup" class="card">
                <h2>Sınıfını ve testini seç</h2>
                <div class="game-setup">
                    <div>
                        <label>Sınıf</label>
                        <select id="gameClass"><option value="">Sınıflar yükleniyor...</option></select>
                    </div>
                    <div>
                        <label>Test</label>
                        <select id="gameTest" disabled><option value="">Önce sınıf seç</option></select>
                    </div>
                    <button class="primary" onclick="startGame()">Başlat</button>
                </div>
            </div>

            <div id="leaderboardCard" class="card">
                <div class="section-heading">
                    <h2 class="title-with-icon">🏅 Sınıf Liderlik Tablosu</h2>
                    <button class="secondary btn-sm" onclick="loadLeaderboard()">↻ Yenile</button>
                </div>
                <div id="leaderboard"></div>
            </div>

            <!-- EĞLENCELİ TEST EKRANI -->
            <div id="quiz" class="card hidden">
                <div class="quiz-topbar">
                    <button class="btn-close" onclick="resetGameView()">✕</button>
                    <div class="progress-track">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <div class="stats-pills">
                        <div class="stat-pill fire">🔥 <span id="streakCount">0</span></div>
                        <div class="stat-pill star">⭐ <span id="score">0</span></div>
                    </div>
                </div>
                
                <p id="questionMeta" class="question-meta">9 B · Soru 1 / 6</p>
                <h2 id="questionText" class="question-title"></h2>
                
                <div id="answers"></div>
                <div id="feedback" aria-live="polite"></div>
                
                <div class="actions">
                    <button id="nextButton" class="primary hidden" onclick="nextQuestion()">Sonraki Soru ➔</button>
                </div>
            </div>
        </section>

        <!-- ÖĞRETMEN PANELİ BÖLÜMÜ (Özetlenmiş İskelet) -->
        <section id="teacher" class="hidden">
            <div id="loginCard" class="card">
                <h2>Öğretmen Girişi</h2>
                <form id="loginForm">
                    <input id="email" type="email" placeholder="E-posta" required>
                    <input id="password" type="password" placeholder="Şifre" required>
                    <button class="primary w-full" type="submit">Giriş Yap</button>
                </form>
                <p id="loginMessage"></p>
            </div>

            <div id="adminPanel" class="hidden">
                <div class="admin-hero card">
                    <h2>Öğretmen Paneli</h2>
                    <button class="danger" onclick="logout()">Çıkış Yap</button>
                </div>
                
                <!-- Öğretmen Paneli İçerikleri (Eski HTML'deki aynı ID'lerle korunarak eklendi) -->
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="overview">Oturum Yönetimi</button>
                    <!-- Diğer sekmeler burada yer alır -->
                </div>
                
                <div class="card" data-admin-tab-panel="overview">
                    <h2>Puanlı Oturum Başlat</h2>
                    <div class="grid2">
                        <select id="scoreSessionClass"><option value="">Sınıf Seç</option></select>
                        <select id="scoreSessionTest"><option value="">Test Seç</option></select>
                    </div>
                    <div class="actions mt-3">
                        <button class="primary" id="startScoreSessionButton" onclick="startScoreSession()">Tahtada Başlat</button>
                        <button class="danger" id="closeScoreSessionButton" onclick="closeScoreSession()" disabled>Oturumu Kapat</button>
                    </div>
                    <p id="teacherSessionStatus" class="mt-3">Aktif oturum yok.</p>
                </div>
                
                <div class="card" data-admin-tab-panel="overview">
                    <h2 class="title-with-icon">🏅 Sınıf Sıralaması</h2>
                    <div id="teacherLeaderboard"></div>
                </div>
            </div>
        </section>
        <p id="globalMessage"></p>
    </main>
</body>
</html>
